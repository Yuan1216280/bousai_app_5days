<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: light;
      --ink: #18324b;
      --muted: #607487;
      --blue: #245aa5;
      --blue-deep: #174781;
      --line: #e1e8ee;
      --surface: #ffffff;
      --canvas: #f3f6f8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.65;
    }

    .site-header {
      position: relative;
      z-index: 1000;
      background: var(--blue);
      color: white;
      box-shadow: 0 2px 8px rgba(20, 46, 74, .15);
    }

    .header-inner {
      width: min(1380px, calc(100% - 40px));
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: white;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: .04em;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      padding: 10px;
      display: grid;
      align-content: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .menu-button span {
      height: 2px;
      border-radius: 2px;
      background: white;
    }

    .menu-button:hover, .menu-button:focus-visible { background: var(--blue-deep); }

    .site-nav {
      position: absolute;
      top: calc(100% - 1px);
      right: max(20px, calc((100% - 1380px) / 2));
      min-width: 230px;
      padding: 8px;
      display: none;
      border: 1px solid var(--line);
      border-radius: 0 0 6px 6px;
      background: var(--surface);
      box-shadow: 0 12px 26px rgba(24, 50, 75, .16);
    }

    .site-nav.is-open { display: grid; }

    .site-nav a, .nav-session {
      padding: 10px 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .site-nav a:hover, .site-nav a:focus-visible { background: #edf4fa; }
    .nav-session { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 30px auto 56px;
    }

    @media (max-width: 520px) {
      .header-inner { width: calc(100% - 28px); min-height: 60px; }
      .brand { font-size: 19px; }
      .site-nav { right: 14px; }
      main { width: calc(100% - 24px); margin-top: 18px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">防災アプリ</a>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="site-nav" id="siteNav" aria-label="メインナビゲーション">
      <a href="/">ホーム</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示・発信ボード</a>
      {% if session.logged_in %}
        <span class="nav-session">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</span>
        <a href="/logout">ログアウト</a>
      {% else %}
        <span class="nav-session">未ログイン</span>
        <a href="/login">ログイン</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const siteNav = document.getElementById('siteNav');
    menuButton.addEventListener('click', function() {
      const isOpen = siteNav.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });
    document.addEventListener('click', function(event) {
      if (!event.target.closest('.site-header') && siteNav.classList.contains('is-open')) {
        siteNav.classList.remove('is-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.setAttribute('aria-label', 'メニューを開く');
      }
    });
  </script>
</body>
</html>
